# ==============================================================================
# STALKER 2 CAMERA TWEAKS
# ==============================================================================
# Author: Elhait
# Engine: Unreal Engine 5.5.4
#
# GitHub: https://github.com/Elhait/STALKER-2-Camera-Tweaks-and-Ultrawide-for-UE-5.5.4
# Nexus: https://www.nexusmods.com/stalker2heartofchornobyl/mods/2416
#
# Edit this file while the game is closed.
# Settings changed in the Overlay are saved automatically where supported.
# Boolean values: true / false.
# ==============================================================================


[Gameplay]
# <Gameplay.Enabled>
# ------------------------------------------------------------------------------
# Controls camera correction during normal gameplay.
# ------------------------------------------------------------------------------
# Enable Gameplay camera correction.
# Default: true
# true - Enable the selected Gameplay correction.
# false - Stop further Gameplay correction and leave the game's original camera/aspect behavior in control. The result of a native camera recalculation may persist until the game or save is reloaded.
# </Gameplay.Enabled>
Enabled = true

# <Gameplay.Mode>
# Available modes:
#   AspectRecalculation - Uses the game's native aspect transition while preserving the selected Gameplay FOV. On custom windowed aspects, restoring Auto may return the window to its native aspect and size.
#   HorPlus - Preserves Gameplay writer FOV changes and transforms each sample using the aspect observed at that writer, including during zoom.
# Examples - Gameplay FOV · no zoom:
# Gameplay baseline 90° → cinematic ENTER FOV: 16:9 90°; 21:9 ~106.69°; 32:9 ~126.87°.
# 100° → 16:9: 100°; 21:9: ~116.04°; 32:9: ~134.48°.
# 110° → 16:9: 110°; 21:9: ~124.95°; 32:9: ~141.41°.
#   RuntimeCombine (Recommended) - Combines the former Aspect Recalculation and HorPlus modes for seamless transitions between Gameplay and cinematics. It synchronizes the Gameplay camera aspect with the current window aspect instead of relying on the value captured when the camera was loaded, and resynchronizes it when the display resolution changes. Hor+ FOV correction is applied only after synchronization is confirmed. This is the recommended mode for smooth transitions into and out of cinematics.
# Default: RuntimeCombine
# </Gameplay.Mode>
Mode = RuntimeCombine


[Cinematics]
# <Cinematics.Enabled>
# ------------------------------------------------------------------------------
# Controls cinematic framing and FOV correction.
# ------------------------------------------------------------------------------
# Master switch for cinematic camera corrections.
# Default: true
# true - Apply the selected cinematic framing and FOV corrections.
# false - Do not apply Camera Tweaks cinematic corrections; leave camera output game-controlled.
# </Cinematics.Enabled>
Enabled = true

# <Cinematics.Mode>
# Available modes:
#   Auto - Uses the current runtime viewport aspect for cinematic framing. Supports arbitrary valid aspect ratios.
#   16:9 - Uses 16:9 framing for cinematics, regardless of the display aspect.
#   21:9 - Uses 21:9 framing for cinematics, regardless of the display aspect.
#   32:9 - Uses 32:9 framing for cinematics, regardless of the display aspect.
# Example: 32:9 on a 16:9 display produces wider framing with black bars above and below.
# Default: Auto
# </Cinematics.Mode>
Mode = Auto

# <Cinematics.FovMode>
# Available modes:
#   GameplayHorPlus - Matches the cinematic ENTER FOV to the Gameplay FOV and preserves authored changes during the scene. If no valid Gameplay FOV is available, uses NativeHorPlus.
# Examples - Authored cinematic ENTER FOV: 90° · rows show Gameplay baseline and corrected ENTER FOV:
# Gameplay baseline 90° → cinematic ENTER FOV: 16:9 90°; 21:9 ~106.69°; 32:9 ~126.87°.
# Gameplay baseline 112.6° → cinematic ENTER FOV: 16:9 112.6°; 21:9 118.51°; 32:9 ~143.13°.
#   NativeHorPlus - Applies HorPlus to the authored cinematic FOV, independently of the player's Gameplay FOV setting.
# Examples - Cinematic FOV 90° · results by aspect:
# 16:9: 90°; 21:9: ~106.69°; 32:9: ~126.87°.
# Default: GameplayHorPlus
# </Cinematics.FovMode>
FovMode = GameplayHorPlus


[Dialogue]
# <Dialogue.Enabled>
# ------------------------------------------------------------------------------
# Controls Dialogue camera zoom correction.
# ------------------------------------------------------------------------------
# Master switch for Dialogue correction.
# Default: true
# true - Apply the selected mode after an accepted Dialogue start.
# false - Do not apply Dialogue correction; keep game camera output and continue observing its lifecycle for recovery.
# </Dialogue.Enabled>
Enabled = true

# <Dialogue.Mode>
# Available modes:
#   Adaptive - Preserve the game's original optical zoom strength relative to current Gameplay FOV.
# Examples - Gameplay FOV → dialogue FOV:
# 90° → 70°.
# 110° → approximately 90°.
#   Reduced - Use half of the Adaptive optical zoom strength.
# 90° → approximately 80°.
# 110° → approximately 100°.
#   Disabled - Disable dialogue zoom and keep current Gameplay FOV.
# 90° → 90°.
# 110° → 110°.
# Default: Adaptive
# </Dialogue.Mode>
Mode = Reduced


[Diagnostics]
# <Diagnostics.Enabled>
# ------------------------------------------------------------------------------
# Optional read-only runtime telemetry.
# ------------------------------------------------------------------------------
# Startup-only. Restart the game after changing this value.
# true - Enable passive runtime telemetry and diagnostic log records.
# false - Disable optional telemetry; camera correction and Overlay behavior are unchanged.
# Default: false
# </Diagnostics.Enabled>
Enabled = true


[Overlay]
# <Overlay.Enabled>
# ------------------------------------------------------------------------------
# Controls the optional Overlay subsystem.
# ------------------------------------------------------------------------------
# Startup-only. Restart the game after changing this value.
# true - Initialize the Overlay so its menu and startup notifications can be shown.
# false - Skip Overlay initialization; camera corrections remain active.
# Default: true
# </Overlay.Enabled>
Enabled = true

# <Overlay.ToggleKey>
# Use this key to open or close the overlay. Independent of Hotkeys.Enabled.
# Press a key to assign it. Press Esc to cancel.
# Bind a single ordinary keyboard key. Modifier combinations and mouse buttons are not supported.
# Default: Delete
# </Overlay.ToggleKey>
ToggleKey = VK_2E

# <Overlay.Language>
# Auto follows the game's Interface Language when the Overlay opens.
# Or select a locale code from the supported locale registry.
# Default: Auto
# </Overlay.Language>
Language = Auto

# <Overlay.FontSize>
# Overlay font size in pixels. Supported range: 12-24.
# Changes apply immediately and are saved to this configuration file.
# Default: 13
# </Overlay.FontSize>
FontSize = 13

# <Overlay.PositionX>
# ------------------------------------------------------------------------------
# Automatically managed Overlay layout settings
# ------------------------------------------------------------------------------
# Saved Overlay window position in pixels.
# Default: 30, 30
# </Overlay.PositionX>
PositionX = 1949
PositionY = 258

# <Overlay.PositionMigrationComplete>
# Internal one-time migration marker for the former separate Overlay INI.
# Default: 0
# </Overlay.PositionMigrationComplete>
PositionMigrationComplete = 1


[Hotkeys]
# <Hotkeys.Enabled>
# ------------------------------------------------------------------------------
# Optional keyboard shortcuts for changing settings while playing.
# ------------------------------------------------------------------------------
# Enable or disable Gameplay, Cinematic and Dialogue hotkey actions.
# Default: false
# true - Enable Gameplay, Cinematic and Dialogue hotkey actions.
# false - Disable these actions. Overlay Toggle remains active independently.
# </Hotkeys.Enabled>
Enabled = false

# <Hotkeys.GameplayCycle>
# Cycles the Gameplay correction immediately: AspectRecalculation -> HorPlus -> RuntimeCombine -> AspectRecalculation.
# Press a key to assign it. Press Esc to cancel.
# Bind a single ordinary keyboard key. Modifier combinations and mouse buttons are not supported.
# Default: F9
# </Hotkeys.GameplayCycle>
GameplayCycle = F9

# <Hotkeys.CinematicCycle>
# Cycles framing for the next cinematic: Auto -> 16:9 -> 21:9 -> 32:9 -> Auto.
# Press a key to assign it. Press Esc to cancel.
# Bind a single ordinary keyboard key. Modifier combinations and mouse buttons are not supported.
# Default: F10
# </Hotkeys.CinematicCycle>
CinematicCycle = F10

# <Hotkeys.CinematicFovCycle>
# Sets the FOV mode for the next cinematic: NativeHorPlus -> GameplayHorPlus -> NativeHorPlus. Does not affect a cinematic already playing.
# Press a key to assign it. Press Esc to cancel.
# Bind a single ordinary keyboard key. Modifier combinations and mouse buttons are not supported.
# Default: F11
# </Hotkeys.CinematicFovCycle>
CinematicFovCycle = F11

# <Hotkeys.DialogueCycle>
# Cycles selectable Dialogue modes: Adaptive -> Reduced -> Disabled -> Adaptive.
# Press a key to assign it. Press Esc to cancel.
# Bind a single ordinary keyboard key. Modifier combinations and mouse buttons are not supported.
# Default: F12
# </Hotkeys.DialogueCycle>
DialogueCycle = F12